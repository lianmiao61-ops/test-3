.month-cell.today {

  box-shadow: 0 0 0 2px var(--accent-light);
}

.month-cell.other-month {
  background: var(--bg3);
  opacity: 0.5;
}

.month-cell-date {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.month-cell.today .month-cell-date {
  color: var(--accent);
}

.month-cell.other-month .month-cell-date { color: var(--muted2); }

.month-cell-tasks {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  overflow: hidden;
}

.month-task {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg3);
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: var(--transition);
  border-left: 2px solid transparent;
}

.month-task:hover { background: var(--accent-light); }

.month-task.cat-design { border-left-color: var(--cat-design); }
.month-task.cat-frontend { border-left-color: var(--cat-frontend); }
.month-task.cat-backend { border-left-color: var(--cat-backend); }
.month-task.cat-devops { border-left-color: var(--cat-devops); }
.month-task.cat-marketing { border-left-color: var(--cat-marketing); }

.month-task.done { text-decoration: line-through; color: var(--muted); }

.month-more {
  font-size: 10px;
  color: var(--muted);
  padding: 1px 6px;
  cursor: pointer;
}

.month-more:hover { color: var(--accent); }

.cal-unscheduled {
  background: var(--bg2);
  border: 1px solid var(--rule-light);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-top: 16px;
}

.cal-unscheduled-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 12px;
}

.cal-unscheduled-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.unsched-chip {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--bg3);
  color: var(--ink2);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 5px;
}

.unsched-chip:hover {
  background: var(--accent-light);
  color: var(--accent);
}

.unsched-chip .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.unsched-chip[data-cat="design"] .dot { background: var(--cat-design); }
.unsched-chip[data-cat="frontend"] .dot { background: var(--cat-frontend); }
.unsched-chip[data-cat="backend"] .dot { background: var(--cat-backend); }
.unsched-chip[data-cat="devops"] .dot { background: var(--cat-devops); }
.unsched-chip[data-cat="marketing"] .dot { background: var(--cat-marketing); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg2);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.35s var(--ease);
}

@keyframes modalIn {
  from { transform: translateY(24px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.modal::-webkit-scrollbar { width: 6px; }
.modal::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.modal-header {
  padding: 24px 28px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: var(--transition);
}

.modal-close:hover { background: var(--bg3); color: var(--ink); }
.modal-close svg { width: 18px; height: 18px; }

.modal-body { padding: 20px 28px; }

.form-group { margin-bottom: 18px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 6px;
}

.form-group label .required { color: var(--pri-high); }

.form-control {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  background: var(--bg2);
  transition: var(--transition);
  outline: none;
}

.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}

textarea.form-control {
  resize: vertical;
  min-height: 72px;
  line-height: 1.5;
}

.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

.priority-options, .cat-options {
  display: flex;
  gap: 8px;
}

.priority-option, .cat-option {
  flex: 1;
  padding: 9px;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.priority-option .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.priority-option.high .dot { background: var(--pri-high); }
.priority-option.mid .dot { background: var(--pri-mid); }
.priority-option.low .dot { background: var(--pri-low); }

.priority-option.high.selected { border-color: var(--pri-high); background: rgba(255,59,48,0.06); color: var(--pri-high); }
.priority-option.mid.selected { border-color: var(--pri-mid); background: rgba(255,149,0,0.06); color: var(--pri-mid); }
.priority-option.low.selected { border-color: var(--pri-low); background: rgba(52,199,89,0.06); color: var(--pri-low); }

.cat-option {
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  padding: 8px 4px;
}

.cat-option .cat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.cat-option[data-cat="design"] .cat-dot { background: var(--cat-design); }
.cat-option[data-cat="frontend"] .cat-dot { background: var(--cat-frontend); }
.cat-option[data-cat="backend"] .cat-dot { background: var(--cat-backend); }
.cat-option[data-cat="devops"] .cat-dot { background: var(--cat-devops); }
.cat-option[data-cat="marketing"] .cat-dot { background: var(--cat-marketing); }

.cat-option[data-cat="design"].selected { border-color: var(--cat-design); background: rgba(94,92,230,0.06); color: var(--cat-design); }
.cat-option[data-cat="frontend"].selected { border-color: var(--cat-frontend); background: rgba(0,113,227,0.06); color: var(--cat-frontend); }
.cat-option[data-cat="backend"].selected { border-color: var(--cat-backend); background: rgba(52,199,89,0.06); color: var(--cat-backend); }
.cat-option[data-cat="devops"].selected { border-color: var(--cat-devops); background: rgba(255,149,0,0.06); color: var(--cat-devops); }
.cat-option[data-cat="marketing"].selected { border-color: var(--cat-marketing); background: rgba(255,45,85,0.06); color: var(--cat-marketing); }

.range-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}

.range-wrap input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 6px;
  background: var(--rule-light);
  border-radius: 3px;
  outline: none;
}

.range-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid #fff;
  box-shadow: 0 1px 6px rgba(0,113,227,0.3);
}

.range-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  min-width: 40px;
  text-align: right;
}

.tags-input-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  min-height: 42px;
  transition: var(--transition);
}

.tags-input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg3);
  color: var(--ink2);
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 500;
}

.tag-chip .remove-tag {
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  opacity: 0.5;
}

.tag-chip .remove-tag:hover { opacity: 1; }

.tags-input-wrap input {
  border: none;
  outline: none;
  flex: 1;
  min-width: 80px;
  font-size: 14px;
  font-family: inherit;
  background: transparent;
  color: var(--ink);
}

.modal-footer {
  padding: 0 28px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.modal-footer .left-actions, .modal-footer .right-actions {
  display: flex;
  gap: 8px;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(29,29,31,0.92);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  z-index: 3000;
  transition: transform 0.35s var(--ease);
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast svg { width: 16px; height: 16px; }

/* ===== Responsive ===== */
@media (max-width: 1024px) {
  .header-inner, .tab-bar-inner, .main { padding-left: 20px; padding-right: 20px; }
  .task-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .month-cell { min-height: 90px; }
}

@media (max-width: 768px) {
  .header-inner { padding: 0 16px; height: 52px; }
  .tab-bar-inner { padding: 0 16px; height: 44px; }
  .tab-bar { top: 52px; }
  .main { padding: 20px 16px 60px; }
  .brand h1 { font-size: 16px; }
  .search-box input { width: 140px; }
  .search-box input:focus { width: 160px; }
  .summary { gap: 10px; }
  .summary-card { min-width: calc(50% - 5px); padding: 14px 16px; }
  .summary-card .num { font-size: 24px; }
  .cal-title { font-size: 17px; min-width: auto; }
  .week-grid { gap: 4px; }
  .week-day-col { min-height: 200px; }
  .week-day-name { font-size: 10px; }
  .week-day-num { font-size: 16px; }
  .month-cell { min-height: 70px; padding: 4px; }
  .month-cell-date { font-size: 12px; }
  .month-task { font-size: 10px; padding: 1px 4px; }
  .task-grid { grid-template-columns: 1fr; }
  .cat-options { flex-wrap: wrap; }
  .cat-option { flex: 1 1 30%; }
}

@media (max-width: 600px) {
  .week-grid { grid-template-columns: 1fr; }
  .week-day-col { min-height: auto; }
  .export-btn-text { display: none; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h1>项目工作台</h1>
    </div>
    <div class="header-actions">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索任务..." />
      </div>
      <button class="btn btn-ghost" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="export-btn-text">导出</span>
      </button>
      <button class="btn btn-primary" id="addTaskBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        新建任务
      </button>
    </div>
  </div>
</header>

<!-- ===== Tab Bar ===== -->
<div class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab active" data-view="board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1"/>
        <rect x="14" y="3" width="7" height="5" rx="1"/>
        <rect x="14" y="12" width="7" height="9" rx="1"/>
        <rect x="3" y="16" width="7" height="5" rx="1"/>
      </svg>
      看板
    </button>
    <button class="tab" data-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      周历
    </button>
    <button class="tab" data-view="month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="8" y2="14"/>
        <line x1="12" y1="14" x2="12" y2="14"/>
        <line x1="16" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="8" y2="18"/>
        <line x1="12" y1="18" x2="12" y2="18"/>
        <line x1="16" y1="18" x2="16" y2="18"/>
      </svg>
      月历
    </button>
  </div>
</div>

<!-- ===== Main ===== -->
<div class="main">

  <!-- ===== Board View ===== -->
  <div class="view active" id="view-board">
    <div class="summary" id="summary"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div id="boardContent"></div>
  </div>

  <!-- ===== Week View ===== -->
  <div class="view" id="view-week">
    <div class="cal-nav">
      <div class="cal-nav-center">
        <button class="cal-nav-btn" id="weekPrev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="cal-title" id="weekTitle"></div>
        <button class="cal-nav-btn" id="weekNext">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <button class="cal-today-btn" id="weekToday">回到本周</button>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="cal-unscheduled" id="weekUnscheduled" style="display:none;">
      <div class="cal-unscheduled-title">未排期任务</div>
      <div class="cal-unscheduled-list" id="weekUnscheduledList"></div>
    </div>
  </div>

  <!-- ===== Month View ===== -->
  <div class="view" id="view-month">
    <div class="cal-nav">
      <div class="cal-nav-center">
        <button class="cal-nav-btn" id="monthPrev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="cal-title" id="monthTitle"></div>
        <button class="cal-nav-btn" id="monthNext">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <button class="cal-today-btn" id="monthToday">回到本月</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
    <div class="cal-unscheduled" id="monthUnscheduled" style="display:none;">
      <div class="cal-unscheduled-title">未排期任务</div>
      <div class="cal-unscheduled-list" id="monthUnscheduledList"></div>
    </div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新建任务</h2>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>任务标题 <span class="required">*</span></label>
        <input type="text" class="form-control" id="taskTitle" placeholder="输入任务名称..." maxlength="100" />
      </div>
      <div class="form-group">
        <label>任务描述</label>
        <textarea class="form-control" id="taskDesc" placeholder="补充任务详情..." maxlength="500"></textarea>
      </div>
      <div class="form-group">
        <label>所属大类</label>
        <div class="cat-options" id="catOptions">
          <div class="cat-option" data-cat="design"><span class="cat-dot"></span><span>产品设计</span></div>
          <div class="cat-option" data-cat="frontend"><span class="cat-dot"></span><span>前端开发</span></div>
          <div class="cat-option" data-cat="backend"><span class="cat-dot"></span><span>后端开发</span></div>
          <div class="cat-option" data-cat="devops"><span class="cat-dot"></span><span>测试运维</span></div>
          <div class="cat-option" data-cat="marketing"><span class="cat-dot"></span><span>市场运营</span></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>优先级</label>
          <div class="priority-options" id="priorityOptions">
            <div class="priority-option low" data-value="low"><span class="dot"></span> 低</div>
            <div class="priority-option mid selected" data-value="mid"><span class="dot"></span> 中</div>
            <div class="priority-option high" data-value="high"><span class="dot"></span> 高</div>
          </div>
        </div>
        <div class="form-group">
          <label>截止日期</label>
          <input type="date" class="form-control" id="taskDeadline" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>状态</label>
          <select class="form-control" id="taskStatus">
            <option value="todo">待办</option>
            <option value="progress">进行中</option>
            <option value="review">待审核</option>
            <option value="done">已完成</option>
          </select>
        </div>
        <div class="form-group">
          <label>进度</label>
          <div class="range-wrap">
            <input type="range" id="taskProgress" min="0" max="100" step="5" value="0" />
            <span class="range-value" id="progressValue">0%</span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>标签</label>
        <div class="tags-input-wrap" id="tagsWrap">
          <input type="text" id="tagInput" placeholder="输入后回车添加..." />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div class="left-actions">
        <button class="btn btn-danger" id="deleteBtn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          删除
        </button>
      </div>
      <div class="right-actions">

  function getWeekStart(date) {
    var d = new Date(date);

    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function addDays(date, days) {
    var d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function isSameDay(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() &&
           d1.getMonth() === d2.getMonth() &&
           d1.getDate() === d2.getDate();
  }

  function isSameMonth(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
  }

  function toDateStr(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function parseDate(str) {
    if (!str) return null;
    var parts = str.split('-');
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }

  function formatDateCN(dateStr) {
    if (!dateStr) return '';
    var d = parseDate(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function formatMonthDay(dateStr) {
    if (!dateStr) return '';

  // ===== Create Task Card =====
  function createTaskCard(task) {
    var card = document.createElement('div');
    card.className = 'task-card pri-' + task.priority + ' ' + task.status;
    card.dataset.id = task.id;

    var descHtml = task.desc ? '<div class="task-card-desc">' + escapeHtml(task.desc) + '</div>' : '';

        task.tags.map(function(t) { return '<span class="task-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>';
    }

    var progressHtml = '<div class="task-card-progress" data-task-id="' + task.id + '">' +
      '<div class="progress-tooltip">' + task.progress + '%</div>' +
      '<div class="task-card-progress-track">' +

          '<div class="progress-thumb"></div>' +
        '</div>' +
      '</div>' +
    '</div>';

    var deadlineHtml = '';
    if (task.deadline) {
      var isOverdue = false;
      var dl = parseDate(task.deadline);
      if (dl < today() && task.status !== 'done') isOverdue = true;
      deadlineHtml = '<div class="task-card-deadline' + (isOverdue ? ' overdue' : '') + '">' +

        '</svg>' + formatDateCN(task.deadline) + (isOverdue ? ' · 逾期' : '') + '</div>';
    }

    card.innerHTML =
      '<div class="task-card-top">' +
        '<div class="task-card-title">' + escapeHtml(task.title) + '</div>' +
        '<span class="status-badge ' + task.status + '">' + statusLabels[task.status] + '</span>' +
      '</div>' +
      descHtml + tagsHtml + progressHtml +
      '<div class="task-card-footer">' +
        deadlineHtml +
        '<span class="task-card-progress-label">' + task.progress + '%</span>' +
      '</div>';

    // Click opens modal (but not when clicking the progress bar)
    card.addEventListener('click', function(e) {
      if (e.target.closest('.task-card-progress')) return;
      openModal(task.id);
    });

    // Attach drag handler to progress bar
    attachProgressDrag(card.querySelector('.task-card-progress'), task);

    return card;
  }

  // ===== Draggable Progress =====
  function attachProgressDrag(progressEl, task) {
    var fill = progressEl.querySelector('.task-card-progress-fill');
    var thumb = progressEl.querySelector('.progress-thumb');
    var tooltip = progressEl.querySelector('.progress-tooltip');
    var label = null;

    var dragging = false;

    function getProgressFromEvent(e) {
      var rect = progressEl.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var x = clientX - rect.left;
      var pct = Math.round(Math.max(0, Math.min(1, x / rect.width)) * 100);
      // Snap to steps of 5
      pct = Math.round(pct / 5) * 5;
      return pct;
    }

    function updateVisual(pct) {
      fill.style.width = pct + '%';
      if (tooltip) tooltip.textContent = pct + '%';
      // Update label in footer
      var card = progressEl.closest('.task-card');
      if (card) {
        var lbl = card.querySelector('.task-card-progress-label');
        if (lbl) lbl.textContent = pct + '%';
      }
    }

    function onStart(e) {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      progressEl.classList.add('dragging');
      var pct = getProgressFromEvent(e);
      task.progress = pct;
      updateVisual(pct);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }

    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      var pct = getProgressFromEvent(e);
      if (pct !== task.progress) {
        task.progress = pct;
        updateVisual(pct);
      }
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      progressEl.classList.remove('dragging');

      // Auto-update status based on progress
      var statusChanged = false;
      if (task.progress >= 100 && task.status !== 'done') {
        task.status = 'done';
        statusChanged = true;
      } else if (task.progress <= 0 && task.status !== 'todo') {
        task.status = 'todo';
        statusChanged = true;
      } else if (task.progress > 0 && task.progress < 100 && task.status === 'todo') {
        task.status = 'progress';
        statusChanged = true;
      } else if (task.progress > 0 && task.progress < 100 && task.status === 'done') {
        task.status = 'progress';
        statusChanged = true;
      }

      saveTasks();

      if (statusChanged) {
        // Re-render to update status badge + card class
        renderAll();
        showToast('进度 ' + task.progress + '% · 状态已更新为「' + statusLabels[task.status] + '」');
      } else {
        // Just update label visually already done, persist
        showToast('进度已更新为 ' + task.progress + '%');
      }
    }

    progressEl.addEventListener('mousedown', onStart);
    progressEl.addEventListener('touchstart', onStart, { passive: false });
  }

  // ===== Render Week View =====
  function renderWeek() {
    var ws = getWeekStart(weekRef);
    var days = [];
    var dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

    var we = days[6];
    document.getElementById('weekTitle').textContent =
      ws.getFullYear() + '年' + (ws.getMonth() + 1) + '月' + ws.getDate() + '日 - ' +
      (we.getMonth() + 1) + '月' + we.getDate() + '日';

    var grid = document.getElementById('weekGrid');
    grid.innerHTML = '';

    var t = today();
    var unscheduled = [];

    days.forEach(function(day) {
      var dateStr = toDateStr(day);
      var dayTasks = tasks.filter(function(task) { return task.deadline === dateStr; });
      var isToday = isSameDay(day, t);

      var col = document.createElement('div');
      col.className = 'week-day-col' + (isToday ? ' today' : '');

      var taskHtml = '';
      if (dayTasks.length > 0) {
        taskHtml = dayTasks.map(function(task) {
          return '<div class="week-task cat-' + task.category + ' ' + task.status + '" data-id="' + task.id + '">' +
            '<div class="week-task-title">' + escapeHtml(task.title) + '</div>' +
            '<div class="week-task-meta"><span class="dot ' + task.status + '"></span>' +
            statusShort[task.status] + ' · ' + task.progress + '%</div>' +
            '</div>';
        }).join('');
      } else {
        taskHtml = '<div class="week-day-empty">无任务</div>';
      }

      col.innerHTML =
        '<div class="week-day-header">' +
          '<div class="week-day-name">' + dayNames[days.indexOf(day)] + '</div>' +
          '<div class="week-day-num">' + day.getDate() + '</div>' +
        '</div>' +
        '<div class="week-day-body">' + taskHtml + '</div>';

      col.querySelectorAll('.week-task').forEach(function(el) {
        el.addEventListener('click', function() { openModal(el.dataset.id); });
      });

      grid.appendChild(col);
    });

    // Unscheduled tasks
    unscheduled = tasks.filter(function(task) { return !task.deadline; });
    renderUnscheduled('week', unscheduled);
  }

  // ===== Render Month View =====
  function renderMonth() {
    var year = monthRef.getFullYear();
    var month = monthRef.getMonth();
    var monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
    document.getElementById('monthTitle').textContent = year + '年' + monthNames[month];

    var firstDay = new Date(year, month, 1);
    var startDayOfWeek = firstDay.getDay(); // 0=Sun
    var offset = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1; // Mon start
    var gridStart = addDays(firstDay, -offset);

    var grid = document.getElementById('monthGrid');
    grid.innerHTML = '';

    // Day headers
    ['一', '二', '三', '四', '五', '六', '日'].forEach(function(name) {
      var h = document.createElement('div');
      h.className = 'month-day-header';
      h.textContent = name;
      grid.appendChild(h);
    });

    var t = today();
    var unscheduled = tasks.filter(function(task) { return !task.deadline; });

    for (var i = 0; i < 42; i++) {
      var day = addDays(gridStart, i);
      var dateStr = toDateStr(day);
      var isThisMonth = isSameMonth(day, firstDay);
      var isToday = isSameDay(day, t);
      var dayTasks = tasks.filter(function(task) { return task.deadline === dateStr; });

      var cell = document.createElement('div');
      cell.className = 'month-cell' + (isToday ? ' today' : '') + (!isThisMonth ? ' other-month' : '');

      var tasksHtml = '';
      if (dayTasks.length > 0) {
        var shown = dayTasks.slice(0, 3);
        tasksHtml = shown.map(function(task) {
          return '<div class="month-task cat-' + task.category + ' ' + task.status + '" data-id="' + task.id + '" title="' + escapeHtml(task.title) + '">' +
            escapeHtml(task.title) + '</div>';
        }).join('');
        if (dayTasks.length > 3) {
          tasksHtml += '<div class="month-more">+' + (dayTasks.length - 3) + ' 更多</div>';
        }
      }

      cell.innerHTML =
        '<div class="month-cell-date">' + day.getDate() + '</div>' +
        '<div class="month-cell-tasks">' + tasksHtml + '</div>';

      cell.querySelectorAll('.month-task').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          openModal(el.dataset.id);
        });
      });

      grid.appendChild(cell);
    }

    renderUnscheduled('month', unscheduled);
  }

  function renderUnscheduled(prefix, unscheduled) {
    var container = document.getElementById(prefix + 'Unscheduled');
    var list = document.getElementById(prefix + 'UnscheduledList');
    if (unscheduled.length === 0) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'block';
    list.innerHTML = unscheduled.map(function(task) {
      return '<div class="unsched-chip" data-cat="' + task.category + '" data-id="' + task.id + '">' +
        '<span class="dot"></span>' + escapeHtml(task.title) +
        '</div>';
    }).join('');

    list.querySelectorAll('.unsched-chip').forEach(function(el) {
      el.addEventListener('click', function() { openModal(el.dataset.id); });
    });
  }

  // ===== Render All =====
  function renderAll() {
    renderSummary();
    renderFilterBar();
    renderBoard();
    renderWeek();
    renderMonth();
  }

  // ===== Modal =====
  var modalOverlay = document.getElementById('modalOverlay');

  function openModal(taskId, defaultCat) {
    editingId = taskId;
    currentTags = [];

    if (taskId) {
      var task = tasks.find(function(t) { return t.id === taskId; });
      if (!task) return;
      document.getElementById('modalTitle').textContent = '编辑任务';
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('taskDesc').value = task.desc || '';
      document.getElementById('taskDeadline').value = task.deadline || '';
      document.getElementById('taskStatus').value = task.status;
      document.getElementById('taskProgress').value = task.progress;
      document.getElementById('progressValue').textContent = task.progress + '%';
      setPriority(task.priority);
      setCategory(task.category);
      currentTags = (task.tags || []).slice();
      document.getElementById('deleteBtn').style.display = 'inline-flex';
    } else {
      document.getElementById('modalTitle').textContent = '新建任务';
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value = '';
      document.getElementById('taskDeadline').value = '';
      document.getElementById('taskStatus').value = 'todo';
      document.getElementById('taskProgress').value = 0;
      document.getElementById('progressValue').textContent = '0%';
      setPriority('mid');
      setCategory(defaultCat || 'design');
      currentTags = [];
      document.getElementById('deleteBtn').style.display = 'none';
    }

    renderTags();
    modalOverlay.classList.add('active');
    setTimeout(function() { document.getElementById('taskTitle').focus(); }, 100);
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
    editingId = null;
    currentTags = [];
    document.getElementById('tagInput').value = '';
  }

  function setPriority(value) {
    document.querySelectorAll('.priority-option').forEach(function(opt) {
      opt.classList.toggle('selected', opt.dataset.value === value);
    });
  }

  function getPriority() {
    var sel = document.querySelector('.priority-option.selected');
    return sel ? sel.dataset.value : 'mid';
  }

  function setCategory(value) {
    document.querySelectorAll('.cat-option').forEach(function(opt) {
      opt.classList.toggle('selected', opt.dataset.cat === value);
    });
  }

  function getCategory() {
    var sel = document.querySelector('.cat-option.selected');
    return sel ? sel.dataset.cat : 'design';
  }

  function renderTags() {
    var wrap = document.getElementById('tagsWrap');
    var input = document.getElementById('tagInput');
    wrap.querySelectorAll('.tag-chip').forEach(function(c) { c.remove(); });
    currentTags.forEach(function(tag) {
      var chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = escapeHtml(tag) + '<span class="remove-tag" data-tag="' + escapeHtml(tag) + '">&times;</span>';
      wrap.insertBefore(chip, input);
    });
  }

  function saveTask() {
    var title = document.getElementById('taskTitle').value.trim();
    if (!title) {
      showToast('请输入任务标题');
      document.getElementById('taskTitle').focus();
      return;
    }

    var status = document.getElementById('taskStatus').value;
    var progressVal = parseInt(document.getElementById('taskProgress').value, 10);
    if (status === 'done') progressVal = 100;
    if (status === 'todo') progressVal = 0;

    var taskData = {
      title: title,
      desc: document.getElementById('taskDesc').value.trim(),
      category: getCategory(),
      priority: getPriority(),
      deadline: document.getElementById('taskDeadline').value,
      status: status,
      progress: progressVal,
      tags: currentTags.slice()
    };

    if (editingId) {
      var idx = tasks.findIndex(function(t) { return t.id === editingId; });
      if (idx > -1) {
        tasks[idx] = Object.assign(tasks[idx], taskData);
        showToast('任务已更新');
      }
    } else {
      tasks.push(Object.assign({ id: genId() }, taskData));
      showToast('任务已创建');
    }

    saveTasks();
    renderAll();
    closeModal();
  }

  function deleteTask() {
    if (!editingId) return;
    tasks = tasks.filter(function(t) { return t.id !== editingId; });
    saveTasks();
    renderAll();
    closeModal();
    showToast('任务已删除');
  }

  // ===== Toast =====
  var toastTimer = null;
  function showToast(msg) {
    var toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  }

  // ===== Helpers =====
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== Event Bindings =====

  // Tab switching
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentView = tab.dataset.view;
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.getElementById('view-' + currentView).classList.add('active');
    });
  });

  // Add task
  document.getElementById('addTaskBtn').addEventListener('click', function() { openModal(null); });

  // Modal
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
  document.getElementById('saveBtn').addEventListener('click', saveTask);
  document.getElementById('deleteBtn').addEventListener('click', deleteTask);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && modalOverlay.classList.contains('active')) saveTask();
  });

  // Priority & Category
  document.querySelectorAll('.priority-option').forEach(function(opt) {
    opt.addEventListener('click', function() { setPriority(opt.dataset.value); });
  });
  document.querySelectorAll('.cat-option').forEach(function(opt) {
    opt.addEventListener('click', function() { setCategory(opt.dataset.cat); });
  });

  // Progress slider
  document.getElementById('taskProgress').addEventListener('input', function() {
    document.getElementById('progressValue').textContent = this.value + '%';
  });

  // Status auto-adjust
  document.getElementById('taskStatus').addEventListener('change', function() {
    var status = this.value;
    var slider = document.getElementById('taskProgress');
    var label = document.getElementById('progressValue');
    if (status === 'done') { slider.value = 100; label.textContent = '100%'; }
    else if (status === 'todo') { slider.value = 0; label.textContent = '0%'; }
  });

  // Tags input
  var tagInput = document.getElementById('tagInput');
  tagInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      var val = tagInput.value.trim();
      if (val && currentTags.indexOf(val) === -1 && currentTags.length < 6) {
        currentTags.push(val);
        renderTags();
      }
      tagInput.value = '';
    }
    if (e.key === 'Backspace' && !tagInput.value && currentTags.length > 0) {
      currentTags.pop();
      renderTags();
    }
  });
  document.getElementById('tagsWrap').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-tag')) {
      currentTags = currentTags.filter(function(t) { return t !== e.target.dataset.tag; });
      renderTags();
    }
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    searchTerm = e.target.value.trim();
    renderSummary();
    renderFilterBar();
    renderBoard();
  });

  // Export
  document.getElementById('exportBtn').addEventListener('click', function() {
    var data = JSON.stringify(tasks, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'workboard-' + toDateStr(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('数据已导出');
  });

  // Week navigation
  document.getElementById('weekPrev').addEventListener('click', function() {
    weekRef = addDays(getWeekStart(weekRef), -7);
    renderWeek();
  });
  document.getElementById('weekNext').addEventListener('click', function() {
    weekRef = addDays(getWeekStart(weekRef), 7);
    renderWeek();
  });
  document.getElementById('weekToday').addEventListener('click', function() {
    weekRef = new Date();
    renderWeek();
  });

  // Month navigation
  document.getElementById('monthPrev').addEventListener('click', function() {
    monthRef = new Date(monthRef.getFullYear(), monthRef.getMonth() - 1, 1);
    renderMonth();
  });
  document.getElementById('monthNext').addEventListener('click', function() {
    monthRef = new Date(monthRef.getFullYear(), monthRef.getMonth() + 1, 1);
    renderMonth();
  });
  document.getElementById('monthToday').addEventListener('click', function() {
    monthRef = new Date();
    renderMonth();
  });

  // ===== Init =====
  loadTasks();
  renderAll();
})();
</script>
</body>
</html>
